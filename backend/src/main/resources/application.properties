server.port=8080
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.cors.allowed-origins=http://localhost:5173,https://*.vercel.app

app.model.enabled=${APP_MODEL_ENABLED:true}
app.model.required=${APP_MODEL_REQUIRED:false}
app.model.base-url=${APP_MODEL_BASE_URL:https://soothing-luck-production.up.railway.app}
app.model.backup-base-url=${APP_MODEL_BACKUP_BASE_URL:https://soothing-luck-production.up.railway.app}
app.model.frame-endpoint=${APP_MODEL_FRAME_ENDPOINT:/predict/frame}
app.model.video-endpoint=${APP_MODEL_VIDEO_ENDPOINT:/predict/video}
app.model.fallback-threshold=${APP_MODEL_FALLBACK_THRESHOLD:0.55}
